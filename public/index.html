<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hypercraft</title>
<style>
:root { color-scheme:dark; --gold:#f9dc8c; --silver:#eef5ff; }
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,"Noto Sans KR",sans-serif;background:#03040a;color:#fff;overflow:hidden}
button,input{font:inherit}
button{cursor:pointer}
#scene{position:fixed;inset:0;overflow:hidden;background:#05050c}
#aurora{position:absolute;inset:-30%;background:
 radial-gradient(ellipse at 20% 30%,rgba(255,45,110,.65),transparent 27%),
 radial-gradient(ellipse at 70% 25%,rgba(0,220,255,.52),transparent 30%),
 radial-gradient(ellipse at 60% 75%,rgba(174,60,255,.58),transparent 32%),
 radial-gradient(ellipse at 25% 80%,rgba(255,190,35,.42),transparent 27%),
 linear-gradient(125deg,#071020,#170b2b,#031a28);
 filter:saturate(1.35);animation:auroraMove 13s ease-in-out infinite alternate, hueCycle 18s linear infinite}
#aurora:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 35px,rgba(255,255,255,.025) 36px,transparent 38px);mix-blend-mode:screen}
@keyframes auroraMove{to{transform:translate(5%,-3%) scale(1.08)}}
@keyframes hueCycle{0%,100%{filter:hue-rotate(0deg) saturate(1.5)}11%{filter:hue-rotate(25deg) saturate(1.5)}22%{filter:hue-rotate(55deg) saturate(1.6)}33%{filter:hue-rotate(100deg) saturate(1.5)}44%{filter:hue-rotate(160deg) saturate(1.5)}55%{filter:hue-rotate(210deg) saturate(1.5)}66%{filter:hue-rotate(260deg) saturate(1.6)}77%{filter:hue-rotate(300deg) saturate(1.4)}88%{filter:hue-rotate(340deg) saturate(1.1)}}
#stars{position:absolute;inset:0;pointer-events:none}
.star{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 7px 3px #fff,0 0 20px 8px #7cecff,0 0 34px 12px #a95bff;animation:twinkle 1s ease-in-out infinite alternate}
.star:after{content:"";position:absolute;left:-9px;right:-9px;top:2px;height:1px;background:linear-gradient(90deg,transparent,#fff,transparent)}
.star:nth-child(1){left:14%;top:24%;animation-delay:.1s}.star:nth-child(2){left:82%;top:19%;animation-delay:.35s}.star:nth-child(3){left:75%;top:72%;animation-delay:.6s}.star:nth-child(4){left:23%;top:79%;animation-delay:.8s}
@keyframes twinkle{from{opacity:.18;transform:scale(.55)}to{opacity:1;transform:scale(1.35)}}
#grain{position:absolute;inset:0;opacity:.16;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.32'/%3E%3C/svg%3E");mix-blend-mode:overlay;pointer-events:none}
.screen{position:relative;z-index:2;display:none;min-height:100dvh;width:100%;align-items:center;justify-content:center;padding:24px}
.screen.active{display:flex}
.glass{background:linear-gradient(135deg,rgba(4,5,11,.91),rgba(15,11,23,.78));border:1px solid rgba(255,255,255,.28);box-shadow:0 0 0 1px rgba(255,255,255,.04),0 0 35px rgba(104,224,255,.15),inset 0 0 34px rgba(255,255,255,.035);backdrop-filter:blur(18px);position:relative}
.glass:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 10%,rgba(255,255,255,.12) 15%,transparent 22%,transparent 70%,rgba(255,255,255,.05) 76%,transparent 82%);opacity:.5}
.auth-card{width:min(440px,100%);padding:34px 30px 28px;border-radius:5px;text-align:center;overflow:hidden}
.brand-gold{font-weight:900;letter-spacing:.13em;font-size:clamp(26px,6vw,38px);background:linear-gradient(110deg,#805b16 0%,#fff2b2 18%,#c7962e 32%,#fff8d8 45%,#9b6a16 60%,#fff0ad 76%,#b88724 90%);background-size:220% auto;color:transparent;background-clip:text;-webkit-background-clip:text;animation:goldShine 2.4s linear infinite;filter:drop-shadow(0 0 12px rgba(255,199,67,.28))}
@keyframes goldShine{to{background-position:220% center}}
.subtitle{font-size:11px;letter-spacing:.32em;color:#b9c9dd;margin:10px 0 26px}
.tabs{display:flex;gap:8px;margin-bottom:22px}
.tab{flex:1;background:transparent;border:1px solid rgba(255,255,255,.18);color:#b8bdcb;padding:11px}
.tab.active{border-color:#f4d78a;color:#fff4c8;box-shadow:inset 0 -2px #d5ad52,0 0 15px #d5ad5222}
.field{display:block;text-align:left;margin:13px 0;color:#c5cada;font-size:12px;letter-spacing:.08em}
.field input{width:100%;margin-top:7px;padding:13px 12px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.45);color:#fff;outline:none;border-radius:2px}
.field input:focus{border-color:#8beaff;box-shadow:0 0 14px #4ee7ff2b}
.primary{width:100%;margin-top:12px;padding:13px;border:1px solid rgba(255,230,164,.8);color:#fff4cb;font-weight:800;letter-spacing:.16em;background:linear-gradient(110deg,#382b15,#8b6728,#34250d);box-shadow:inset 0 1px #fff5c055,0 0 18px #e6b44b22;transition:.2s}
.primary:hover{filter:brightness(1.3);box-shadow:0 0 25px #e6b44b55}
.notice{min-height:18px;font-size:12px;color:#ffb8c7;margin-top:13px}
.small-note{display:none}
#welcomeText{font-size:clamp(28px,6vw,64px);font-weight:900;text-align:center;letter-spacing:.06em;background:linear-gradient(100deg,#fff,#83f5ff,#fff,#ff8df7,#fff4a6,#fff);background-size:250% auto;color:transparent;background-clip:text;-webkit-background-clip:text;filter:drop-shadow(0 0 18px #7deaff99);animation:welcomeGlow 2.2s linear infinite}
@keyframes welcomeGlow{to{background-position:250% center}}
.welcome-sub{margin-top:15px;color:#d9e7ff;letter-spacing:.32em;font-size:11px;text-align:center}
#titleScreen{align-items:stretch;justify-content:center;text-align:center;padding:5vh 4vw}
.title-wrap{width:min(850px,100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(22px,5vh,46px)}
.game-logo{font-size:clamp(42px,10vw,92px);font-weight:1000;line-height:1;letter-spacing:.055em;background:linear-gradient(180deg,#fff 0%,#c8d0dc 17%,#fff 30%,#697586 49%,#f7fbff 62%,#aab5c3 78%,#fff 100%);background-size:100% 220%;color:transparent;background-clip:text;-webkit-background-clip:text;text-shadow:0 0 25px #bde8ff30;filter:drop-shadow(0 4px 0 #1a1e28);animation:silverShine 1.5s ease-in-out infinite alternate}
@keyframes silverShine{from{background-position:0 0;filter:drop-shadow(0 0 8px #c8f4ff22)}to{background-position:0 100%;filter:drop-shadow(0 0 20px #d7f6ff99)}}
.tagline{font-size:10px;letter-spacing:.45em;color:#d8e0f1;margin-top:12px}
.menu{width:min(390px,90%);display:flex;flex-direction:column;gap:12px}
.menu-btn{position:relative;overflow:hidden;padding:15px 20px;color:#f5f7fc;font-weight:750;letter-spacing:.12em;background:linear-gradient(90deg,rgba(16,19,29,.88),rgba(47,53,66,.78),rgba(11,14,23,.9));border:1px solid rgba(231,242,255,.55);box-shadow:inset 0 1px #fff5,0 5px 20px #0006;clip-path:polygon(3% 0,97% 0,100% 50%,97% 100%,3% 100%,0 50%);transition:.2s}
.menu-btn:before{content:"";position:absolute;top:-100%;left:-35%;width:25%;height:300%;transform:rotate(25deg);background:#fff4;transition:left .5s}
.menu-btn:hover{background:linear-gradient(90deg,#24394a,#45556c,#1d283a);box-shadow:0 0 22px #73eaff45}
.menu-btn:hover:before{left:120%}
.menu-btn:active{transform:scale(.985)}
.version{color:#c0c8d7;font-size:10px;letter-spacing:.14em}
.lang-area{position:fixed;right:22px;bottom:20px;z-index:5;display:flex;align-items:center;gap:10px}
.lang-label{font-size:10px;letter-spacing:.14em;color:#d4dbea;text-shadow:0 0 8px #000}
.lang-button{width:48px;height:48px;border-radius:50%;border:1px solid #e8edf7a8;background:linear-gradient(135deg,#202735,#080a12 60%,#59677b);box-shadow:inset 0 1px #fff7,0 0 20px #7be8ff24;color:white;font-size:12px;font-weight:800}
.lang-button:hover{box-shadow:0 0 20px #88eaff88}
.lang-menu{position:absolute;right:0;bottom:58px;display:none;min-width:145px;padding:6px;background:#090c15ee;border:1px solid #b9c9df77;backdrop-filter:blur(12px)}
.lang-menu.open{display:block}
.lang-choice{display:block;width:100%;text-align:left;border:0;background:transparent;color:#e9efff;padding:10px}
.lang-choice:hover{background:#ffffff18}
.overlay{position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;padding:20px;background:#02040bcc;backdrop-filter:blur(10px)}
.overlay.open{display:flex}
.dialog{width:min(450px,100%);padding:28px;text-align:center;border-radius:4px}
.dialog h2{margin:0 0 12px;color:#eaf6ff;letter-spacing:.12em}
.dialog p{color:#b8c6da;font-size:13px;line-height:1.7}
.dialog .primary{margin-top:16px}
.cube-mark{display:grid;grid-template-columns:repeat(3,10px);gap:2px;justify-content:center;margin-bottom:18px;transform:skewY(-10deg)}
.cube-mark i{width:10px;height:10px;background:linear-gradient(135deg,#e8faff,#3e8da6);box-shadow:0 0 7px #76eaff88}

.world-splash{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:#03040bd9;backdrop-filter:blur(9px);animation:splashFade 1s ease both}.world-splash span{font-size:clamp(38px,9vw,82px);font-weight:950;letter-spacing:.06em;background:linear-gradient(100deg,#6b4610,#fff0a7,#c38a21,#fff7ce,#a76e11,#fff0a7);background-size:240% auto;color:transparent;background-clip:text;-webkit-background-clip:text;filter:drop-shadow(0 0 22px #e8b94799);animation:goldShine .9s linear infinite}@keyframes splashFade{0%{opacity:0}15%,75%{opacity:1}100%{opacity:0}}
/* Minecraft-inspired settings panels: beveled gray buttons, restrained holographic accents */
.mc-dialog{width:min(760px,96vw);max-height:90dvh;overflow:auto;padding:26px 28px;background:linear-gradient(145deg,rgba(15,17,20,.97),rgba(32,34,36,.96));border:2px solid #090a0c;box-shadow:0 0 0 1px #7d858d,0 14px 50px #000b,inset 0 0 0 1px #555b62;border-radius:0}
.mc-dialog h2{font-size:clamp(20px,3vw,29px);font-weight:500;letter-spacing:.03em;color:#f2f2f2;text-shadow:0 2px #333;margin:0 0 22px}
.world-form{display:grid;grid-template-columns:1fr 1fr;gap:15px 18px;text-align:left}
.setting-field{display:flex;flex-direction:column;gap:7px;color:#d9d9d9;text-align:left;font-size:13px}
.setting-field input:not([type=checkbox]),.setting-field select{width:100%;min-width:0;background:#17191b;border:2px solid #050607;box-shadow:inset 0 0 0 1px #73787c;color:#fff;padding:11px 12px;border-radius:0;outline:none}
.segmented{display:flex;gap:4px}.segmented button{flex:1;min-width:0;padding:9px 4px;color:#eee;background:#4b4d4f;border:2px solid #111;box-shadow:inset 0 1px #b7b7b7,0 1px #000;font-size:12px}.segmented button.selected{background:#6b6d70;border-color:#e3e3e3;color:#fff}
.setting-row{grid-column:1/-1;display:flex;gap:25px;flex-wrap:wrap;color:#eee;font-size:13px}.setting-row label{display:flex;align-items:center;gap:7px}.setting-row input{accent-color:#c4a85d}
.dialog-actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.mc-button{min-height:43px;padding:10px 13px;color:#f3f3f3;background:linear-gradient(#77797b,#5b5d5f 48%,#454749);border:2px solid #0b0c0d;border-radius:0;box-shadow:inset 0 1px #d1d1d1,inset 0 -2px #303234,0 0 0 1px #999; font-size:13px;text-shadow:0 1px #222;transition:filter .12s,transform .12s}
.mc-button:hover{filter:brightness(1.22);outline:1px solid #f1f1f1}.mc-button:active{transform:translateY(1px);filter:brightness(.9)}
.dialog-note{color:#aeb4bb;font-size:11px;line-height:1.6;margin:14px 0 0}.settings-dialog{width:min(900px,96vw)}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;text-align:left}.settings-grid .setting-field{min-height:58px}.settings-footer{display:flex;justify-content:center;margin-top:20px}.save-button{width:min(360px,100%);min-height:54px;font-size:17px;font-weight:800}.back-button{width:100%;margin-top:12px}
@media(max-width:600px){.mc-dialog{padding:21px 15px}.world-form,.settings-grid{grid-template-columns:1fr}.setting-row{grid-column:auto}.settings-grid .setting-field{min-height:auto}.dialog-actions{gap:8px}.mc-button{font-size:12px;padding:9px 7px}}

@media(max-width:560px){.auth-card{padding:28px 21px}.lang-area{right:13px;bottom:13px}.lang-label{display:none}.lang-button{width:44px;height:44px}.title-wrap{padding-bottom:45px}.game-logo{letter-spacing:.02em}}

/* Hypercraft restrained prism-combat finish: Minecraft bevels + quiet holographic edge light */
.mc-dialog{
  background:linear-gradient(145deg,rgba(18,20,25,.975),rgba(35,37,42,.965) 52%,rgba(20,23,30,.98));
  border:2px solid #090b10;
  box-shadow:0 0 0 1px rgba(178,194,211,.72),0 14px 50px #000c,
    inset 0 0 0 1px #555d66,inset 0 1px rgba(255,255,255,.08);
  position:relative;
}
.mc-dialog:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:linear-gradient(112deg,transparent 0%,rgba(255,70,119,.035) 17%,transparent 28%,
  rgba(255,207,83,.035) 40%,transparent 51%,rgba(69,235,218,.045) 64%,transparent 75%,rgba(155,105,255,.035) 88%,transparent 100%);
}
.mc-dialog h2{position:relative;text-shadow:0 2px #222,0 0 10px rgba(140,220,255,.12)}
.mc-button,.menu-btn{
  background:linear-gradient(180deg,#85888b 0%,#6c6f73 44%,#55585c 50%,#65686c 100%);
  border:2px solid #101216;
  box-shadow:inset 0 1px rgba(255,255,255,.58),inset 0 -2px rgba(18,20,24,.72),
    0 0 0 1px rgba(185,198,211,.48),0 2px 5px rgba(0,0,0,.3);
  text-shadow:0 1px 2px #16181b;
  transition:background .18s,box-shadow .18s,filter .18s,transform .12s;
}
.mc-button{position:relative;isolation:isolate}
.mc-button:before,.menu-btn:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.32;
  background:linear-gradient(105deg,transparent 0%,rgba(255,100,140,.08) 18%,transparent 30%,
  rgba(255,223,115,.08) 44%,transparent 56%,rgba(83,235,220,.09) 70%,transparent 82%,rgba(175,124,255,.08) 94%,transparent 100%);
}
.mc-button:hover,.menu-btn:hover{
  background:linear-gradient(180deg,#92969a 0%,#747a80 44%,#5d6268 50%,#74777d 100%);
  box-shadow:inset 0 1px rgba(255,255,255,.72),inset 0 -2px rgba(18,20,24,.68),
    0 0 0 1px rgba(218,230,242,.72),0 0 10px rgba(94,218,255,.13),0 0 14px rgba(223,116,255,.07);
  filter:brightness(1.04);outline:none;transform:translateY(-1px)
}
.mc-button:active,.menu-btn:active{transform:translateY(1px);filter:brightness(.94)}
.menu-btn{clip-path:none;background:linear-gradient(180deg,rgba(117,121,127,.93),rgba(75,80,88,.96) 52%,rgba(91,96,104,.95));border-color:#11141a}
.menu-btn:hover{background:linear-gradient(180deg,rgba(133,144,155,.96),rgba(78,99,112,.97) 52%,rgba(94,106,121,.96))}
.settings-dialog{background:linear-gradient(145deg,rgba(15,17,21,.97),rgba(30,33,39,.95) 55%,rgba(17,20,27,.97))}
.settings-grid .setting-field input:not([type=checkbox]),.settings-grid .setting-field select,
.world-form .setting-field input:not([type=checkbox]),.world-form .setting-field select{
  background:linear-gradient(100deg,#11151a,#202329 55%,#15181e);
  border-color:#080a0d;box-shadow:inset 0 1px 3px #000,inset 0 0 0 1px #646b73;
}
.settings-grid .setting-field input:focus,.settings-grid .setting-field select:focus,
.world-form .setting-field input:focus,.world-form .setting-field select:focus{
  border-color:#9abac8;box-shadow:inset 0 0 0 1px #8497a7,0 0 7px rgba(89,224,239,.16);outline:none
}
.segmented button.selected{background:linear-gradient(180deg,#747b83,#565e67);border-color:#b6c5d2;box-shadow:inset 0 1px #e5edf4,0 0 7px rgba(105,224,255,.13)}
.save-button{background:linear-gradient(180deg,#8a8e92,#6b7075 48%,#555a60 52%,#73777d);border-color:#11141a}
.save-button:hover{box-shadow:inset 0 1px #fff9,0 0 0 1px #d9e7f3,0 0 14px rgba(90,231,226,.18)}
.lang-button{background:radial-gradient(circle at 30% 20%,rgba(245,250,255,.35),rgba(57,69,84,.88) 40%,rgba(8,10,15,.98) 78%);border-color:rgba(197,222,238,.72);box-shadow:inset 0 1px #fff5,0 0 12px rgba(91,221,255,.12),0 0 12px rgba(206,99,255,.06)}

</style>
</head>
<body>
<div id="scene" aria-hidden="true">
  <div id="aurora"></div>
  <div id="stars"><i class="star"></i><i class="star"></i><i class="star"></i><i class="star"></i></div>
  <div id="grain"></div>
</div>

<main>
  <section id="authScreen" class="screen active">
    <div class="auth-card glass">
      <div class="brand-gold">HYPERCRAFT</div>
      
      <div class="tabs">
        <button class="tab active" id="loginTab" data-i18n="login">로그인</button>
        <button class="tab" id="signupTab" data-i18n="signup">회원가입</button>
      </div>
      <form id="authForm">
        <label class="field"><span data-i18n="id">아이디</span><input id="userId" autocomplete="username" minlength="3" maxlength="24" required placeholder="3~24 characters"></label>
        <label class="field"><span data-i18n="password">비밀번호</span><input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="At least 6 characters"></label>
        <button class="primary" id="submitAuth" type="submit" data-i18n="login">로그인</button>
        <div class="notice" id="authNotice" role="status"></div>
      </form>
    </div>
  </section>

  <section id="welcomeScreen" class="screen">
    <div>
      <div id="welcomeText" data-i18n="welcome">환영합니다</div>
      <div class="welcome-sub">WELCOME TO THE HOLOGRAPHIC WORLD</div>
    </div>
  </section>

  <section id="titleScreen" class="screen">
    <div class="title-wrap">
      <div>
        <div class="game-logo">Hypercraft</div>
        <div class="tagline">BUILD YOUR OWN REALITY</div>
      </div>
      <div class="menu">
        <button class="menu-btn" id="singleBtn" data-i18n="single">싱글 플레이</button>
        <button class="menu-btn" id="multiBtn" data-i18n="multi">멀티플레이</button>
        <button class="menu-btn" id="settingsBtn" data-i18n="settings">설정</button>
      </div>
      <div class="version">HYPERCRAFT</div>
    </div>
    <div class="lang-area">
      <span class="lang-label" data-i18n="language">언어</span>
      <div style="position:relative">
        <button class="lang-button" id="langButton" aria-label="Language settings">한</button>
        <div class="lang-menu" id="langMenu">
          <button class="lang-choice" data-lang="ko">🇰🇷 한국어</button>
          <button class="lang-choice" data-lang="zh">🇨🇳 中文</button>
          <button class="lang-choice" data-lang="ja">🇯🇵 日本語</button>
          <button class="lang-choice" data-lang="en">🇬🇧 English</button>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="overlay" id="worldOverlay">
  <div class="dialog glass mc-dialog">
    <h2 data-i18n="createWorld">새로운 세계 만들기</h2>
    <div class="world-form">
      <label class="setting-field"><span data-i18n="worldName">세계 이름</span><input id="worldName" value="새로운 세계" maxlength="32"></label>
      <label class="setting-field"><span data-i18n="seed">세계 시드</span><input id="worldSeed" placeholder="비워두면 무작위 시드"></label>
      <div class="setting-field"><span data-i18n="gamemode">게임 모드</span><div class="segmented" id="gameModes"><button type="button" class="selected" data-mode="survival" data-i18n="survival">서바이벌</button><button type="button" data-mode="creative" data-i18n="creative">크리에이티브</button><button type="button" data-mode="hardcore" data-i18n="hardcore">하드코어</button></div></div>
      <label class="setting-field"><span data-i18n="difficulty">난이도</span><select id="difficulty"><option value="peaceful" data-i18n="peaceful">평화로움</option><option value="easy" data-i18n="easy">쉬움</option><option value="normal" selected data-i18n="normal">보통</option><option value="hard" data-i18n="hard">어려움</option></select></label>
      <div class="setting-row"><label><input id="allowCheats" type="checkbox"> <span data-i18n="cheats">치트 허용</span></label><label><input id="bonusChest" type="checkbox"> <span data-i18n="bonusChest">보너스 상자</span></label></div>
    </div>
    <p class="dialog-note" data-i18n="worldNote">설정한 옵션은 저장됩니다. 실제 월드 생성은 다음 개발 단계에서 연결됩니다.</p>
    <div class="dialog-actions"><button class="mc-button" id="createWorldBtn" data-i18n="create">세계 만들기</button><button class="mc-button" id="cancelWorldBtn" data-i18n="cancel">취소</button></div>
  </div>
</div>
<div class="overlay" id="settingsOverlay">
  <div class="dialog glass mc-dialog settings-dialog">
    <h2 data-i18n="settings">설정</h2>
    <div class="settings-grid">
      <label class="setting-field"><span data-i18n="fov">시야 범위</span><select id="fov"><option>보통</option><option>70</option><option>90</option><option>110</option><option>최대</option></select></label>
      <label class="setting-field"><span data-i18n="playerSeen">누가 접속했는지 알 수 있음</span><select id="visibility"><option value="shown" data-i18n="shown">표시</option><option value="hidden" data-i18n="hidden">숨김</option></select></label>
      <button class="mc-button" id="videoSettings" data-i18n="video">비디오 설정...</button><button class="mc-button" id="musicToggle" data-i18n="music">음악: 켜짐</button>
      <button class="mc-button" id="languageSettings" data-i18n="language">언어</button><button class="mc-button" id="controlsSettings" data-i18n="controls">조작 버튼 커스텀 설정</button>
      <button class="mc-button" id="resourceSettings" data-i18n="resource">리소스팩...</button><button class="mc-button" id="chatSettings" data-i18n="chat">대화 설정 (친구와 공용 채팅)</button>
      <button class="mc-button" id="accessSettings" data-i18n="accessibility">접근성 설정...</button><button class="mc-button" id="creatorSettings" data-i18n="creator">제작자 권한 문구</button>
    </div>
    <div class="settings-footer"><button class="mc-button save-button" id="saveSettings" data-i18n="save">설정 저장</button></div>
    <p class="dialog-note" id="settingsNotice" aria-live="polite"></p>
    <button class="mc-button back-button" id="closeSettings" data-i18n="back">돌아가기</button>
  </div>
</div>
<div class="overlay" id="gameOverlay">
  <div class="dialog glass">
    <div class="cube-mark"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <h2 id="dialogTitle">HYPERCRAFT</h2>
    <p id="dialogText">이 메뉴는 다음 개발 단계에서 구현할 예정입니다.</p>
    <button class="primary" id="closeDialog" data-i18n="back">돌아가기</button>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const screens = ["authScreen", "welcomeScreen", "titleScreen"];
let authMode = "login";
let currentLanguage = localStorage.getItem("hypercraft-language") || "ko";

const translations = {
  ko: {subtitle:"홀로그램 세계",login:"로그인",signup:"회원가입",id:"아이디",password:"비밀번호",security:"",welcome:"환영합니다",single:"싱글 플레이",multi:"멀티플레이",settings:"설정",language:"언어",back:"돌아가기",created:"회원가입이 완료되었습니다. 이제 로그인해 주세요.",logged:"로그인되었습니다.",exists:"이미 존재하는 아이디입니다.",missing:"아이디 또는 비밀번호가 올바르지 않습니다.",needSignup:"먼저 회원가입을 해주세요.",invalid:"아이디는 3자 이상, 비밀번호는 6자 이상이어야 합니다.",singleText:"",multiText:"멀티플레이 서버 연결은 다음 단계에서 구현할 예정입니다.",createWorld:"새로운 세계 만들기",worldName:"세계 이름",seed:"세계 시드",gamemode:"게임 모드",survival:"서바이벌",creative:"크리에이티브",hardcore:"하드코어",difficulty:"난이도",peaceful:"평화로움",easy:"쉬움",normal:"보통",hard:"어려움",cheats:"치트 허용",bonusChest:"보너스 상자",worldNote:"옵션은 저장됩니다. 실제 월드 생성은 다음 개발 단계에서 연결됩니다.",create:"세계 만들기",cancel:"취소",fov:"시야 범위",playerSeen:"접속자 표시",shown:"표시",hidden:"숨김",video:"비디오 설정...",music:"음악: 켜짐",controls:"조작 버튼 커스텀 설정",resource:"리소스팩...",chat:"대화 설정 (친구와 공용 채팅 가능)",accessibility:"접근성 설정...",creator:"제작자 권한 문구",save:"설정 저장",saved:"설정이 저장되었습니다.",notImplemented:"이 항목의 세부 설정은 다음 단계에서 연결됩니다."},
  zh: {subtitle:"全息世界",login:"登录",signup:"注册",id:"用户名",password:"密码",security:"",welcome:"欢迎",single:"单人游戏",multi:"多人游戏",settings:"设置",language:"语言",back:"返回",created:"注册成功，请登录。",logged:"登录成功。",exists:"该用户名已存在。",missing:"用户名或密码不正确。",needSignup:"请先注册。",invalid:"用户名至少3个字符，密码至少6个字符。",singleText:"",multiText:"多人服务器连接将在下一阶段实现。",createWorld:"创建新世界",worldName:"世界名称",seed:"世界种子",gamemode:"游戏模式",survival:"生存",creative:"创造",hardcore:"极限",difficulty:"难度",peaceful:"和平",easy:"简单",normal:"普通",hard:"困难",cheats:"允许作弊",bonusChest:"奖励箱",worldNote:"设置将被保存。实际世界生成将在后续阶段连接。",create:"创建世界",cancel:"取消",fov:"视野范围",playerSeen:"显示在线玩家",shown:"显示",hidden:"隐藏",video:"视频设置...",music:"音乐：开启",controls:"自定义控制",resource:"资源包...",chat:"聊天设置（可与好友聊天）",accessibility:"辅助功能...",creator:"创作者权限文本",save:"保存设置",saved:"设置已保存。",notImplemented:"此项目的详细设置将在后续阶段连接。"},
  ja: {subtitle:"ホログラムの世界",login:"ログイン",signup:"新規登録",id:"ユーザーID",password:"パスワード",security:"",welcome:"ようこそ",single:"シングルプレイ",multi:"マルチプレイ",settings:"設定",language:"言語",back:"戻る",created:"登録が完了しました。ログインしてください。",logged:"ログインしました。",exists:"このIDは既に使用されています。",missing:"IDまたはパスワードが正しくありません。",needSignup:"先に登録してください。",invalid:"IDは3文字以上、パスワードは6文字以上必要です。",singleText:"",multiText:"マルチプレイ接続は次の段階で実装します。",createWorld:"新しいワールドを作成",worldName:"ワールド名",seed:"ワールドシード",gamemode:"ゲームモード",survival:"サバイバル",creative:"クリエイティブ",hardcore:"ハードコア",difficulty:"難易度",peaceful:"ピースフル",easy:"イージー",normal:"ノーマル",hard:"ハード",cheats:"チートを許可",bonusChest:"ボーナスチェスト",worldNote:"設定は保存されます。ワールド生成は次の開発段階で接続します。",create:"ワールドを作成",cancel:"キャンセル",fov:"視野",playerSeen:"オンライン表示",shown:"表示",hidden:"非表示",video:"ビデオ設定...",music:"音楽：オン",controls:"操作をカスタマイズ",resource:"リソースパック...",chat:"チャット設定",accessibility:"アクセシビリティ...",creator:"制作者権限テキスト",save:"設定を保存",saved:"設定を保存しました。",notImplemented:"詳細設定は次の段階で接続します。"},
  en: {subtitle:"HOLOGRAPHIC WORLD",login:"Log In",signup:"Sign Up",id:"Username",password:"Password",security:"",welcome:"Welcome",single:"Singleplayer",multi:"Multiplayer",settings:"Settings",language:"Language",back:"Back",created:"Account created. Please log in.",logged:"Logged in.",exists:"That username already exists.",missing:"Incorrect username or password.",needSignup:"Please sign up first.",invalid:"Username must be 3+ characters and password 6+ characters.",singleText:"",multiText:"Multiplayer server connection will be added in a later stage.",createWorld:"Create New World",worldName:"World Name",seed:"World Seed",gamemode:"Game Mode",survival:"Survival",creative:"Creative",hardcore:"Hardcore",difficulty:"Difficulty",peaceful:"Peaceful",easy:"Easy",normal:"Normal",hard:"Hard",cheats:"Allow Cheats",bonusChest:"Bonus Chest",worldNote:"Options will be saved. Actual world generation will be connected in a later development stage.",create:"Create World",cancel:"Cancel",fov:"Field of View",playerSeen:"Show who is online",shown:"Shown",hidden:"Hidden",video:"Video Settings...",music:"Music: On",controls:"Customize Controls",resource:"Resource Packs...",chat:"Chat Settings (shared chat with friends)",accessibility:"Accessibility Settings...",creator:"Creator Permissions Text",save:"Save Settings",saved:"Settings saved.",notImplemented:"Detailed controls for this item will be added later."}
};
const t = (key) => (translations[currentLanguage] || translations.ko)[key] || translations.ko[key] || key;

function showScreen(id) {
  screens.forEach(s => $(s).classList.toggle("active", s === id));
}
function setMode(mode) {
  authMode = mode;
  $("loginTab").classList.toggle("active", mode === "login");
  $("signupTab").classList.toggle("active", mode === "signup");
  $("submitAuth").textContent = t(mode === "login" ? "login" : "signup");
  $("authNotice").textContent = "";
  $("password").autocomplete = mode === "login" ? "current-password" : "new-password";
}
$("loginTab").addEventListener("click", () => setMode("login"));
$("signupTab").addEventListener("click", () => setMode("signup"));

function readUsers() {
  try { return JSON.parse(localStorage.getItem("hypercraft-users") || "{}"); }
  catch { return {}; }
}
$("authForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  const id = $("userId").value.trim();
  const password = $("password").value;
  const notice = $("authNotice");
  if (id.length < 3 || password.length < 6) { notice.textContent = t("invalid"); return; }
  const users = readUsers();
  if (authMode === "signup") {
    if (users[id]) { notice.textContent = t("exists"); return; }
    // Prototype only: never store plaintext passwords in a real service.
    users[id] = { password };
    localStorage.setItem("hypercraft-users", JSON.stringify(users));
    setMode("login");
    notice.textContent = t("created");
    $("password").value = "";
    return;
  }
  if (!users[id]) { notice.textContent = t("needSignup"); return; }
  if (users[id].password !== password) { notice.textContent = t("missing"); return; }
  sessionStorage.setItem("hypercraft-current-user", id);
  $("authNotice").textContent = t("logged");
  showScreen("welcomeScreen");
  window.setTimeout(() => showScreen("titleScreen"), 2200);
});

$("langButton").addEventListener("click", () => $("langMenu").classList.toggle("open"));
document.querySelectorAll(".lang-choice").forEach(button => button.addEventListener("click", () => {
  currentLanguage = button.dataset.lang;
  localStorage.setItem("hypercraft-language", currentLanguage);
  $("langButton").textContent = ({ko:"한",zh:"中",ja:"日",en:"EN"})[currentLanguage];
  $("langMenu").classList.remove("open");
  document.documentElement.lang = currentLanguage;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    if (translations[currentLanguage][key]) el.textContent = translations[currentLanguage][key];
  });
  setMode(authMode);
}));
function openDialog(title, message) {
  $("dialogTitle").textContent = title;
  $("dialogText").textContent = message;
  $("gameOverlay").classList.add("open");
}
function openOverlay(id){ $(id).classList.add("open"); }
function closeOverlay(id){ $(id).classList.remove("open"); }
let selectedMode = "survival";
$("singleBtn").addEventListener("click", () => {
  const splash=document.createElement("div"); splash.className="world-splash"; splash.innerHTML='<span>Hypercraft</span>'; document.body.appendChild(splash);
  window.setTimeout(()=>{splash.remove();openOverlay("worldOverlay");},1000);
});
$("multiBtn").addEventListener("click", () => openDialog("MULTIPLAYER", t("multiText")));
$("settingsBtn").addEventListener("click", () => openOverlay("settingsOverlay"));
document.querySelectorAll("#gameModes button").forEach(btn=>btn.addEventListener("click",()=>{selectedMode=btn.dataset.mode;document.querySelectorAll("#gameModes button").forEach(b=>b.classList.toggle("selected",b===btn));}));
$("createWorldBtn").addEventListener("click",()=>{
 const config={name:$("worldName").value.trim()||"Hypercraft World",seed:$("worldSeed").value,mode:selectedMode,difficulty:$("difficulty").value,cheats:$("allowCheats").checked,bonusChest:$("bonusChest").checked,createdAt:new Date().toISOString()};
 localStorage.setItem("hypercraft-last-world",JSON.stringify(config));closeOverlay("worldOverlay");openDialog("WORLD CONFIG SAVED",config.name+" · "+config.mode.toUpperCase()+" · "+config.difficulty.toUpperCase()+"\n설정이 저장되었습니다. 실제 3D 월드 생성은 아직 연결되지 않았습니다.");
});
$("cancelWorldBtn").addEventListener("click",()=>closeOverlay("worldOverlay"));
$("closeSettings").addEventListener("click",()=>closeOverlay("settingsOverlay"));
$("saveSettings").addEventListener("click",()=>{localStorage.setItem("hypercraft-settings",JSON.stringify({fov:$("fov").value,visibility:$("visibility").value,music:musicOn}));$("settingsNotice").textContent=t("saved");});
let musicOn=true;$("musicToggle").addEventListener("click",()=>{musicOn=!musicOn;$("musicToggle").textContent=currentLanguage==="en"?(musicOn?"Music: On":"Music: Off"):(musicOn?"음악: 켜짐":"음악: 꺼짐");});
["videoSettings","controlsSettings","resourceSettings","chatSettings","accessSettings","creatorSettings"].forEach(id=>$(id).addEventListener("click",()=>{$("settingsNotice").textContent=t("notImplemented");}));
$("languageSettings").addEventListener("click",()=>{$("langMenu").classList.toggle("open");});
$("worldOverlay").addEventListener("click",e=>{if(e.target===$("worldOverlay"))closeOverlay("worldOverlay")});
$("settingsOverlay").addEventListener("click",e=>{if(e.target===$("settingsOverlay"))closeOverlay("settingsOverlay")});
$("closeDialog").addEventListener("click", () => $("gameOverlay").classList.remove("open"));
$("gameOverlay").addEventListener("click", e => { if (e.target === $("gameOverlay")) $("gameOverlay").classList.remove("open"); });
$("langButton").textContent = ({ko:"한",zh:"中",ja:"日",en:"EN"})[currentLanguage];
document.documentElement.lang = currentLanguage;
document.querySelectorAll("[data-i18n]").forEach(el => {
  const key = el.dataset.i18n;
  if (translations[currentLanguage][key]) el.textContent = translations[currentLanguage][key];
});
setMode("login");
</script>
</body>
</html>
